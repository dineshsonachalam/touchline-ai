services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      PORT: '8000'
    ports:
      - '127.0.0.1:8000:8000'
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: '8000'
      BACKEND_SCHEME: http
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
